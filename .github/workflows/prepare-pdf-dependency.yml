name: Prepare locked PDF dependency
on:
  push:
    branches: [feature/admin-export-all-applicant-pdf]
    paths: [.github/workflows/prepare-pdf-dependency.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-export-all-applicant-pdf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install pdf-lib@1.17.1 --save-exact --package-lock-only --ignore-scripts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "Lock pdf-lib and exact transitive dependencies"
          git push origin HEAD:feature/admin-export-all-applicant-pdf
