name: Verify pull request
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate official RMUTI crest site icons
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python scripts/generate-site-icons.py
          test -s public/rmuti-crest-16.png
          test -s public/rmuti-crest-32.png
          test -s public/rmuti-crest-180.png
          test -s public/rmuti-crest-192.png
          test -s public/rmuti-crest-512.png
          test -s public/favicon.ico
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
